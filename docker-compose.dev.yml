#version: "3.8"
services:
  cashu-vault-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashu_vault
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashu_vault"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cashu
  payment-adapter-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashu_gateway
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashu_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cashu
  vault-db-init:
    image: postgres:16
    depends_on:
      cashu-vault-db:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashu_vault
      PGPASSWORD: postgres
    volumes:
      - ../cashu-vault/cashu-vault-jpa/src/main/resources/db/migration:/migrations:ro
    entrypoint: ["bash", "-c", "psql -h cashu-vault-db -U postgres -d cashu_vault -f /migrations/V1__init_schema.sql"]
    restart: "no"
    networks:
      - cashu
  vault-db-seed:
    image: postgres:16
    depends_on:
      vault-db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashu_vault
      PGPASSWORD: postgres
    volumes:
      - ./scripts/preload-test-data.sql:/preload-test-data.sql:ro
    entrypoint: ["bash", "-c", "psql -h cashu-vault-db -U postgres -d cashu_vault -f /preload-test-data.sql"]
    restart: "no"
    networks:
      - cashu
  hashicorp-vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/file
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - cashu
  vault-init:
    image: hashicorp/vault:1.18
    depends_on:
      hashicorp-vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://hashicorp-vault:8200
      VAULT_TOKEN: dev-root-token
      VAULT_MOUNT: cashu
    entrypoint: /bin/sh
    command:
      - -c
      - |
        vault secrets enable -path=$$VAULT_MOUNT kv-v2 || true

        vault policy write cashu-vault - <<EOF
        path "$${VAULT_MOUNT}/data/keys/*" {
          capabilities = ["create", "read", "update"]
        }
        path "$${VAULT_MOUNT}/metadata/keys/*" {
          capabilities = ["read", "list", "delete"]
        }
        path "$${VAULT_MOUNT}/data/seeds/*" {
          capabilities = ["create", "read", "update"]
        }
        path "$${VAULT_MOUNT}/metadata/seeds/*" {
          capabilities = ["read", "list"]
        }
        path "$${VAULT_MOUNT}/delete/keys/*" {
          capabilities = ["update"]
        }
        path "$${VAULT_MOUNT}/destroy/keys/*" {
          capabilities = ["update"]
        }
        path "$${VAULT_MOUNT}/metadata/*" {
          capabilities = ["list"]
        }
        EOF

        echo "Vault initialized with $${VAULT_MOUNT} KV v2 engine"
    volumes:
      - vault-data:/vault/file
    restart: "no"
    networks:
      - cashu
  cashu-vault-jpa:
    image: docker.398ja.xyz/cashu-vault-jpa:${CASHU_VAULT_VERSION:-latest}
    environment:
      DATASOURCE_URL: jdbc:postgresql://cashu-vault-db:5432/cashu_vault
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://cashu-vault-db:5432/cashu_vault
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: true
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      CASHU_VAULT_PORT: ${CASHU_VAULT_PORT:-3333}
      SERVER_PORT: ${CASHU_VAULT_PORT:-3333}
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      # HashiCorp Vault configuration
      VAULT_BACKEND: HASHICORP
      VAULT_HASHI_URI: http://hashicorp-vault:8200
      VAULT_HASHI_AUTH_METHOD: TOKEN
      VAULT_HASHI_AUTH_TOKEN: dev-root-token
      VAULT_HASHI_ENGINE_MOUNT: cashu
    depends_on:
      vault-db-init:
        condition: service_completed_successfully
      hashicorp-vault:
        condition: service_healthy
    ports:
      - "${CASHU_VAULT_PORT:-3333}:${CASHU_VAULT_PORT:-3333}"
    volumes:
      - vault-logs:/app/logs
    restart: unless-stopped
    networks:
      - cashu
    healthcheck:
      test: [
        "CMD-SHELL",
        "URL=http://localhost:${CASHU_VAULT_PORT:-3333}/actuator/health/readiness; if command -v curl >/dev/null 2>&1; then curl -fsS \"$$URL\" >/dev/null; elif command -v wget >/dev/null 2>&1; then wget -qO- \"$$URL\" >/dev/null; else echo 'no http client for healthcheck' >&2; exit 1; fi"
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  phoenixd-mock:
    image: docker.398ja.xyz/phoenixd-mock:${PHOENIXD_VERSION:-latest}
    entrypoint: ["java", "-cp", "@/app/jib-classpath-file", "xyz.tcheeric.phoenixd.mock.Main"]
    environment:
      PHOENIXD_PORT: ${PHOENIXD_PORT:-9740}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "${PHOENIXD_PORT:-9740}:${PHOENIXD_PORT:-9740}"
    restart: unless-stopped
    networks:
      cashu:
        aliases:
          - phoenixd
  payment-adapter-rest:
    image: docker.398ja.xyz/payment-adapter-rest:${PAYMENT_ADAPTER_VERSION:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: staging
      PAYMENT_ADAPTER_PORT: ${PAYMENT_ADAPTER_PORT:-8080}
      GATEWAY_API_BASE_URL: ${GATEWAY_API_BASE_URL:-http://payment-adapter-rest}
      SERVER_ADDRESS: 0.0.0.0
      PAYMENT_ADAPTER_PROVIDER: ${PAYMENT_ADAPTER_PROVIDER:-mock}
      PHOENIXD_BASE_URL: http://${PHOENIXD_SERVICE:-phoenixd}:${PHOENIXD_PORT:-9740}
      PHOENIXD_API_KEY: ${PHOENIXD_API_KEY:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-adapter-db:5432/cashu_gateway
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: ${PAYMENT_ADAPTER_PORT:-8080}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      GATEWAY_WALLET_MOCK_PAYMENT_ENABLED: "true"
      GATEWAY_WALLET_MOCK_PAYMENT_PHOENIXD_URL: http://phoenixd-mock:9740
      # Webhook configuration - send payment notifications to mint
      WEBHOOK_URL: http://cashu-mint-rest-dev:${CASHU_MINT_PORT:-7777}/webhook/payment
      WEBHOOK_SECRET: ${MINT_WEBHOOK_SECRET:-dev-webhook-secret}
      WEBHOOK_ENABLED: "true"
    depends_on:
      payment-adapter-db:
        condition: service_healthy
    ports:
      - "${PAYMENT_ADAPTER_PORT:-8080}:${PAYMENT_ADAPTER_PORT:-8080}"
    restart: unless-stopped
    networks:
      - cashu
    healthcheck:
      test: [
        "CMD-SHELL",
        "URL=http://localhost:${PAYMENT_ADAPTER_PORT:-8080}/actuator/health/readiness; if command -v curl >/dev/null 2>&1; then curl -fsS \"$$URL\" >/dev/null; elif command -v wget >/dev/null 2>&1; then wget -qO- \"$$URL\" >/dev/null; else echo 'no http client for healthcheck' >&2; exit 1; fi"
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  cashu-mint-rest-dev:
    build:
      context: .
      dockerfile: cashu-mint-rest/Dockerfile
      args:
        PAYMENT_ADAPTER_VERSION: ${PAYMENT_ADAPTER_VERSION:-0.4.1}
    image: docker.398ja.xyz/cashu-mint-rest:${CASHU_MINT_VERSION:-latest}
    ports:
      - "${CASHU_MINT_PORT:-7777}:${CASHU_MINT_PORT:-7777}"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MINT_PRELOAD_JSON_INPUT: file:/app/scripts/preload-test-data.json
      SERVER_PORT: ${CASHU_MINT_PORT:-7777}
      SERVER_ADDRESS: 0.0.0.0
      # Both env vars point to the same vault service: CASHU_VAULT_BASE_URL is used by
      # cashu-mint-protocol (VaultClientFactory), VAULT_BASE_URL by cashu-mint-admin.
      CASHU_VAULT_BASE_URL: http://cashu-vault-jpa:${CASHU_VAULT_PORT:-3333}
      VAULT_BASE_URL: http://cashu-vault-jpa:${CASHU_VAULT_PORT:-3333}
      PAYMENT_ADAPTER_BASE_URL: http://payment-adapter-rest:${PAYMENT_ADAPTER_PORT:-8080}
      GATEWAY_API_BASE_URL: http://payment-adapter-rest:${PAYMENT_ADAPTER_PORT:-8080}
      GATEWAY_BOLT11_SAT: ${GATEWAY_BOLT11_SAT:-xyz.tcheeric.gateway.phoenixd.PhoenixdGateway}
      GATEWAY_BOLT11: ${GATEWAY_BOLT11:-xyz.tcheeric.gateway.phoenixd.PhoenixdGateway}
      PHOENIXD_BASE_URL: http://phoenixd-mock:${PHOENIXD_PORT:-9740}
      PHOENIXD_API_TOKEN: ${PHOENIXD_API_TOKEN:-local-token}
      PHOENIXD_LNADDRESS: off
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      # Webhook configuration
      MINT_WEBHOOK_SECRET: ${MINT_WEBHOOK_SECRET:-dev-webhook-secret}
      # Gateway client timeouts (optimized for virtual threads)
      GATEWAY_CLIENT_CONNECT_TIMEOUT: ${GATEWAY_CLIENT_CONNECT_TIMEOUT:-5s}
      GATEWAY_CLIENT_READ_TIMEOUT: ${GATEWAY_CLIENT_READ_TIMEOUT:-30s}
    depends_on:
      vault-db-seed:
        condition: service_completed_successfully
      payment-adapter-rest:
        condition: service_healthy
      phoenixd-mock:
        condition: service_started
    restart: unless-stopped
    networks:
      - cashu
    volumes:
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${CASHU_MINT_PORT:-7777}/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  admin-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashu_admin
    ports:
      - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashu_admin"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cashu
  cashu-mint-admin-rest:
    image: cashu-mint-admin-rest:dev
    ports:
      - "${CASHU_MINT_ADMIN_PORT:-7778}:${CASHU_MINT_ADMIN_PORT:-7778}"
    environment:
      SERVER_PORT: ${CASHU_MINT_ADMIN_PORT:-7778}
      SERVER_ADDRESS: 0.0.0.0
      DATASOURCE_URL: jdbc:postgresql://admin-db:5432/cashu_admin
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: postgres
      DATASOURCE_DRIVER: org.postgresql.Driver
      ADMIN_API_TOKEN: ${CASHU_MINT_ADMIN_API_TOKEN:-local-dev-token}
      CASHU_VAULT_BASE_URL: http://cashu-vault-jpa:${CASHU_VAULT_PORT:-3333}
      VAULT_BASE_URL: http://cashu-vault-jpa:${CASHU_VAULT_PORT:-3333}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
    depends_on:
      admin-db:
        condition: service_healthy
      cashu-vault-jpa:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cashu
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${CASHU_MINT_ADMIN_PORT:-7778}/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  cashu-mint-admin-web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npx vite --host 0.0.0.0 --port 3000"]
    ports:
      - "${CASHU_MINT_ADMIN_WEB_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: http://cashu-mint-admin-rest:${CASHU_MINT_ADMIN_PORT:-7778}
    volumes:
      - ./cashu-mint-admin/mint-admin-web:/app
      - admin-web-node-modules:/app/node_modules
    depends_on:
      cashu-mint-admin-rest:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cashu
volumes:
  gateway-db-data:
  vault-logs:
  vault-data:
  admin-web-node-modules:
networks:
  cashu:
    name: cashu
