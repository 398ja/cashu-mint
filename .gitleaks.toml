# gitleaks configuration for the cashu libraries.
#
# Shared with cashu-vault and cashu-lib. Kept as a copy rather than a symlink because gitleaks
# resolves its config relative to the repository being scanned, and CI checks out one repo.
#
# Starts from the upstream default ruleset and narrows it, rather than replacing it: the default
# rules know the shapes of real credentials (AWS keys, GitHub tokens, PEM blocks, Slack tokens),
# and reimplementing that is how a secret scanner quietly stops finding things.
[extend]
useDefault = true

[allowlist]
description = """
Cashu cryptographic test data.

The generic-api-key rule fires on any long high-entropy string, and a Cashu secret, blinded
message, proof commitment or keyset id is exactly that by construction: 64 characters of hex.
The protocol's own NUT test vectors are made of them. Without an allowlist every scan reports
dozens of findings that are all test data, which is how a security check gets ignored — and a
real leak then arrives in the noise.

Deliberately matched by VALUE SHAPE rather than by path. An earlier draft of this file allowlisted
`src/test/java/**` wholesale, and a check confirmed that a real-looking GitHub token committed to
a test file then went undetected. Exempting a location exempts every rule there; exempting a
shape exempts only strings that look like Cashu crypto material. A real AWS key, GitHub token or
PEM block in a test file still fails the job, because none of them is 64 characters of hex.

Verified on this repository by planting all three in a test file and committing: `ghp_...` and a
realistic `AKIA...` key are both reported, while a keyset id is not. Note that gitleaks' upstream
default already allowlists the documentation placeholder AKIAIOSFODNN7EXAMPLE specifically, so
that literal string is NOT a useful probe -- an earlier version of this comment cited it as one,
which was wrong. Probe with a random-looking key instead.
"""

regexes = [
    # 64-char lowercase hex: a Cashu secret, a proof C value, or a 32-byte key in test data.
    '''^[0-9a-f]{64}$''',
    # 66-char compressed secp256k1 point (02/03 prefix + x-coordinate).
    '''^0[23][0-9a-f]{64}$''',
    # 128-char hex: a 64-byte Schnorr signature.
    '''^[0-9a-f]{128}$''',
    # Truncated illustrative values in design documents, e.g. `"secret": "a1b2c3d4e5f6..."` or a
    # `cashuAey...` token abbreviated with an ellipsis. The trailing `...` is what makes them
    # documentation rather than data: a real credential is never written with its middle removed.
    '''\.\.\.$''',
    # Cashu V3/V4 token strings, which are base64 payloads and therefore high-entropy by
    # construction. A token is public by design -- it is what a wallet hands to a payee -- so it
    # is not a credential in the sense this scan is looking for.
    '''^cashu[AB][A-Za-z0-9_-]+$''',
    # A NUT-02 keyset id. The spec is explicit that these are "derived from public data": a
    # keyset id is the hash of the mint's own public keys, published at GET /v1/keys and quoted
    # in every proof a wallet holds. It identifies which public keyset a proof belongs to, so it
    # is not a credential in any sense -- but it is short hex, so generic-api-key fires on it.
    # V1 is 8 bytes with a "00" version byte; V2 is 33 bytes with a "01" version byte.
    '''^00[0-9a-f]{14}$''',
    '''^01[0-9a-f]{64}$''',
    # A UUID. Test fixtures are full of them -- keyset row ids, mint ids, saga ids -- and they
    # are identifiers rather than credentials.
    '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
    # A 32-character repeating-hex test key, i.e. "0123456789abcdef" twice. Obviously fabricated:
    # a real key does not count in hex.
    '''^(?:0123456789abcdef)+$''',
    # Diceware-style test passphrases. The shape -- lowercase words joined by hyphens -- is how a
    # test says "this is a placeholder"; a real credential is not written this way.
    '''^(?:[a-z]+-){3,}[a-z0-9]+$''',
    # The two literal placeholders used throughout the admin tutorials, which account for every
    # remaining finding in this repository (73 of them, all in .md files). Matched by exact value
    # rather than by documentation path, for the reason this file's header gives: exempting a
    # location exempts every rule there, so a real token pasted into a tutorial would then go
    # unreported. These two strings are exempt; anything else in the same file is not.
    #
    # Neither is a default anywhere in the code. `dev-admin-password` appears once more, in
    # docker-compose.dev.yml, and only as prose naming what the adjacent bcrypt hash hashes --
    # the dev profile refuses a plain-text credential outright (#426).
    '''^local-dev-token$''',
    '''^admin:dev-admin-password$''',
]

paths = [
    # Upstream NUT test vectors, copied verbatim from cashubtc/nuts. These are entire documents of
    # protocol fixtures; editing them to satisfy a scanner would defeat the point of vendoring the
    # spec's own test data. This is the one place a path exemption is justified, because the file
    # is not ours to change.
    '''.*/src/test/resources/vectors/.*''',
]
