# Use embedded H2 for tests
spring.datasource.url=jdbc:h2:mem:cashu_mint;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema management for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Avoid binding a fixed port during tests
server.port=0
server.address=127.0.0.1

# Phoenixd gateway test defaults to satisfy bean placeholders
phoenixd.payee=test@example.com
phoenixd.expiry=60
phoenixd.currency=sat
phoenixd.expiration=86400
phoenixd.fee.percent=0.004
phoenixd.fee.fixed=1
phoenixd.lnaddress=off
A1b2C3d4.wid=phoenixd
phoenixd.username=
phoenixd.password=test
phoenixd.base_url=http://localhost:9740
phoenixd.timeout=5000
phoenixd.webhook_secret=

# Voucher test configuration - disabled to allow tests to provide their own mocks
voucher.enabled=false

# Disable observability for tests to avoid SLO configuration conflicts
cashu.observability.enabled=false
management.prometheus.metrics.export.enabled=false

# Disable WebSocket for tests (requires servlet container)
cashu.websocket.enabled=false

# Spec 001 FR-007: the 'test' profile is non-local, so WebhookSecretStartupValidator
# would otherwise refuse to start the context with an empty shared secret. Provide
# a placeholder secret that the existing PaymentWebhookIT / PaymentWebhookE2EIT
# mock-bean validator doesn't actually consult.
cashu.mint.webhook.shared-secret=it-shared-secret
cashu.mint.webhook.provider=phoenixd-it

# Spec 002 T311 — admin endpoint Basic-auth credentials for ITs.
cashu.mint.admin.username=admin-it
cashu.mint.admin.password=it-admin-password

# Issuance rate limit (cashu.mint.issuance.rate-limit) defaults to a
# 10/minute burst. Spring's ApplicationContext cache is shared across IT
# classes in a JVM fork, so IssuanceRateLimitFilter's token bucket is
# shared too: by the time a later class reaches POST /v1/mint the bucket
# is already drained by earlier ones and every request 429s. Raise the
# ceiling rather than disabling, so the filter stays in the chain and is
# still exercised. No IT asserts on this limiter — the only rate-limit IT
# (VoucherEndpointRateLimitIT) drives the separate voucher filter and sets
# cashu.mint.voucher.rate-limit-tokens-per-minute itself.
cashu.mint.issuance.rate-limit.per-minute-burst=100000
cashu.mint.issuance.rate-limit.per-day=1000000
