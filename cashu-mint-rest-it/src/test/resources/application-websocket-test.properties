# WebSocket test profile - enables WebSocket for integration testing

# Use embedded H2 for tests
spring.datasource.url=jdbc:h2:mem:cashu_mint_ws;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema management for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Random port for parallel test execution
server.port=0
server.address=127.0.0.1

# Enable WebSocket for NUT-17 tests
cashu.websocket.enabled=true
cashu.websocket.allowed-origins=*

# Phoenixd gateway test defaults
phoenixd.payee=test@example.com
phoenixd.expiry=60
phoenixd.currency=sat
phoenixd.expiration=86400
phoenixd.fee.percent=0.004
phoenixd.fee.fixed=1
phoenixd.lnaddress=off
A1b2C3d4.wid=phoenixd
phoenixd.username=
phoenixd.password=test
phoenixd.base_url=http://localhost:9740
phoenixd.timeout=5000
phoenixd.webhook_secret=

# Disable features not needed for WebSocket tests
voucher.enabled=false
cashu.observability.enabled=false
management.prometheus.metrics.export.enabled=false
