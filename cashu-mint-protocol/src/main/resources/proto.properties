cashu.units=sat

# Expiry time in minutes
cashu.expiry=15

# Gateways per payment method
# Configure implementation classes for each supported method
# Prefer per-unit mapping; falls back to gateway.<method>
gateway.bolt11.sat=xyz.tcheeric.payment.adapter.ln.phoenixd.PhoenixdGateway
gateway.bolt11=xyz.tcheeric.payment.adapter.ln.phoenixd.PhoenixdGateway
# Optional: uncomment or change as you add support
# gateway.bolt12=xyz.tcheeric.gateway.phoenixd.PhoenixdGateway
# gateway.on_chain=xyz.tcheeric.gateway.phoenixd.PhoenixdGateway
cashu.melt.fee-reserve-percent=0.05

# Voucher mint quote fee percentage (default: 10%)
# Percentage of voucher face value charged as minting fee
# Override with VOUCHER_QUOTE_FEE_PERCENT env var or -Dvoucher.quote.fee-percent system property
voucher.quote.fee-percent=10

# Optional: Maximum allowed percentage to prevent accidental markups (default: 100%)
# Override with VOUCHER_QUOTE_FEE_PERCENT_MAX env var or -Dvoucher.quote.fee-percent.max system property
voucher.quote.fee-percent.max=100
