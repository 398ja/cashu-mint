# Arguments for the Mint preload tooling wired through exec-maven-plugin executions.
# Update these values to redirect the JSON and SQL outputs or to inject a fixed mint id.
# Example: mint.preload.generator.args=scripts/preload-test-data.json 11111111-1111-1111-1111-111111111111
mint.preload.generator.args=scripts/preload-test-data.json
mint.preload.renderer.args=scripts/preload-test-data.json scripts/preload-test-data.sql
