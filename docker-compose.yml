services:
  cashu-mint-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashu_mint
    volumes:
      - mint-db-data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashu_mint"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cashu
    profiles: ["dev", "prod"]

  cashu-vault-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashu_vault
    volumes:
      - vault-db-data:/var/lib/postgresql/data
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashu_vault"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cashu
    profiles: ["dev", "prod"]
    
  cashu-gateway-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashu_gateway
    volumes:
      - gateway-db-data:/var/lib/postgresql/data
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashu_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cashu
    profiles: ["dev", "prod"]

  cashu-vault-jpa:
    image: docker.398ja.xyz/cashu-vault-jpa:${CASHU_VAULT_VERSION:-latest}
    environment:
      DATASOURCE_URL: jdbc:postgresql://cashu-vault-db:5432/cashu_vault
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://cashu-vault-db:5432/cashu_vault
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CASHU_VAULT_PORT: ${CASHU_VAULT_PORT:-8888}
      SERVER_PORT: ${CASHU_VAULT_PORT:-8888}
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    depends_on:
      cashu-vault-db:
        condition: service_healthy
    ports:
      - "${CASHU_VAULT_PORT:-8888}:${CASHU_VAULT_PORT:-8888}"
    restart: unless-stopped
    networks:
      - cashu
    profiles: ["dev", "prod"]
    healthcheck:
      test: [
        "CMD-SHELL",
        "URL=http://localhost:${CASHU_VAULT_PORT:-8888}/actuator/health/readiness; \
        if command -v curl >/dev/null 2>&1; then curl -fsS \"$$URL\" >/dev/null; \
        elif command -v wget >/dev/null 2>&1; then wget -qO- \"$$URL\" >/dev/null; \
        else echo 'no http client for healthcheck' >&2; exit 1; fi"
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  phoenixd-mock:
    image: docker.398ja.xyz/phoenixd-mock:${PHOENIXD_VERSION:-latest}
    entrypoint: ["java", "-cp", "@/app/jib-classpath-file", "xyz.tcheeric.phoenixd.mock.Main"]
    environment:
      PHOENIXD_PORT: ${PHOENIXD_PORT:-9740}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "${PHOENIXD_PORT:-9740}:${PHOENIXD_PORT:-9740}"
    restart: unless-stopped
    networks:
      cashu:
        aliases:
          - phoenixd
    profiles: ["dev"]

  cashu-gateway-rest:
    image: docker.398ja.xyz/cashu-gateway-rest:${CASHU_GATEWAY_VERSION:-latest}
    environment:
      CASHU_GATEWAY_PORT: ${CASHU_GATEWAY_PORT:-8080}
      GATEWAY_API_BASE_URL: ${GATEWAY_API_BASE_URL:-http://cashu-gateway-rest}
      SERVER_ADDRESS: 0.0.0.0
      CASHU_GATEWAY_PROVIDER: ${CASHU_GATEWAY_PROVIDER:-mock}
      PHOENIXD_BASE_URL: http://${PHOENIXD_SERVICE:-phoenixd}:${PHOENIXD_PORT:-9740}
      PHOENIXD_API_KEY: ${PHOENIXD_API_KEY:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://cashu-gateway-db:5432/cashu_gateway
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: ${CASHU_GATEWAY_PORT:-8080}
      # Auto-create/update schema for local/dev convenience
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    depends_on:
      cashu-gateway-db:
        condition: service_healthy
    # No hard dependency on Phoenixd in dev; provider can be 'mock'.
    ports:
      - "${CASHU_GATEWAY_PORT:-8080}:${CASHU_GATEWAY_PORT:-8080}"
    restart: unless-stopped
    networks:
      - cashu
    profiles: ["dev", "prod"]
    healthcheck:
      test: [
        "CMD-SHELL",
        "URL=http://localhost:${CASHU_GATEWAY_PORT:-8080}/actuator/health/readiness; \
        if command -v curl >/dev/null 2>&1; then curl -fsS \"$$URL\" >/dev/null; \
        elif command -v wget >/dev/null 2>&1; then wget -qO- \"$$URL\" >/dev/null; \
        else echo 'no http client for healthcheck' >&2; exit 1; fi"
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  cashu-mint-rest:
    build:
      context: .
      dockerfile: cashu-mint-rest/Dockerfile
    image: docker.398ja.xyz/cashu-mint-rest:${CASHU_MINT_VERSION:-latest}
    ports:
      - "${CASHU_MINT_PORT:-7777}:${CASHU_MINT_PORT:-7777}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cashu-mint-db:5432/cashu_mint
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      DATASOURCE_URL: jdbc:postgresql://cashu-mint-db:5432/cashu_mint
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: postgres
      SERVER_PORT: ${CASHU_MINT_PORT:-7777}
      SERVER_ADDRESS: 0.0.0.0
      CASHU_VAULT_BASE_URL: http://cashu-vault-jpa:${CASHU_VAULT_PORT:-8888}
      # Gateway 0.2.x serves under /api; include it to avoid 405 on /quote
      CASHU_GATEWAY_BASE_URL: http://cashu-gateway-rest:${CASHU_GATEWAY_PORT:-8080}/api
      GATEWAY_API_BASE_URL: http://cashu-gateway-rest:${CASHU_GATEWAY_PORT:-8080}/api
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    depends_on:
      cashu-mint-db:
        condition: service_healthy
      cashu-vault-jpa:
        condition: service_started
      cashu-gateway-rest:
        condition: service_started
      cashu-gateway-webhook:
        condition: service_started
    restart: unless-stopped
    networks:
      - cashu
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${CASHU_MINT_PORT:-7777}/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    profiles: ["dev", "prod"]

  cashu-gateway-webhook:
    image: docker.398ja.xyz/cashu-gateway-webhook:${CASHU_GATEWAY_WEBHOOK_VERSION:-latest}
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: ${CASHU_GATEWAY_WEBHOOK_PORT:-9090}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "${CASHU_GATEWAY_WEBHOOK_PORT:-9090}:${CASHU_GATEWAY_WEBHOOK_PORT:-9090}"
    restart: unless-stopped
    networks:
      - cashu
    profiles: ["dev", "prod"]
    healthcheck:
      test: [
        "CMD-SHELL",
        "URL=http://localhost:${CASHU_GATEWAY_WEBHOOK_PORT:-9090}/actuator/health/readiness; \\\n+        if command -v curl >/dev/null 2>&1; then curl -fsS \"$$URL\" >/dev/null; \\\n+        elif command -v wget >/dev/null 2>&1; then wget -qO- \"$$URL\" >/dev/null; \\\n+        else echo 'no http client for healthcheck' >&2; exit 1; fi"
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  phoenixd:
    image: acinq/phoenixd:latest
    ports:
      - "${PHOENIXD_PORT:-9740}:${PHOENIXD_PORT:-9740}"
    restart: unless-stopped
    networks:
      cashu:
        aliases:
          - phoenixd
    profiles: ["prod"]
    volumes:
      - phoenixd-data:/var/lib/phoenixd/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${PHOENIXD_PORT:-9740}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mint-db-data:
  vault-db-data:
  gateway-db-data:
  phoenixd-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PHOENIXD_DATA_DIR:-${HOME}/.phoenixd}

networks:
  cashu:
    name: cashu
