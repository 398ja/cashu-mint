spring.application.name=cashu-mint-admin-rest
server.port=${SERVER_PORT:${CASHU_MINT_ADMIN_PORT:7778}}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Actuator (basic health/info exposure for ops)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true

# Console logging with overridable levels
spring.output.ansi.enabled=ALWAYS
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.xyz.tcheeric.cashu=${LOG_LEVEL_CASHU:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n

# Administrative API security
admin.security.api-token=${ADMIN_API_TOKEN:local-dev-token}
