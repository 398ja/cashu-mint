#version: "3.8"
services:
  cashu-vault-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashu_vault
    volumes:
      - vault-db-data:/var/lib/postgresql/data
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashu_vault"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cashu
  payment-adapter-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashu_gateway
    volumes:
      - gateway-db-data:/var/lib/postgresql/data
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashu_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cashu
  admin-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashu_admin
    volumes:
      - admin-db-data:/var/lib/postgresql/data
    ports:
      - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashu_admin"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cashu
  hashicorp-vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/file
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - cashu
  vault-init:
    image: hashicorp/vault:1.18
    depends_on:
      hashicorp-vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://hashicorp-vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_MOUNT: ${VAULT_HASHI_ENGINE_MOUNT:-cashu}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        vault secrets enable -path=$$VAULT_MOUNT kv-v2 || true

        vault policy write cashu-vault - <<EOF
        path "$${VAULT_MOUNT}/data/keys/*" {
          capabilities = ["create", "read", "update"]
        }
        path "$${VAULT_MOUNT}/metadata/keys/*" {
          capabilities = ["read", "list", "delete"]
        }
        path "$${VAULT_MOUNT}/data/seeds/*" {
          capabilities = ["create", "read", "update"]
        }
        path "$${VAULT_MOUNT}/metadata/seeds/*" {
          capabilities = ["read", "list"]
        }
        path "$${VAULT_MOUNT}/delete/keys/*" {
          capabilities = ["update"]
        }
        path "$${VAULT_MOUNT}/destroy/keys/*" {
          capabilities = ["update"]
        }
        path "$${VAULT_MOUNT}/metadata/*" {
          capabilities = ["list"]
        }
        EOF

        vault auth enable approle || true

        vault write auth/approle/role/cashu-vault \
          token_policies="cashu-vault" \
          token_ttl=1h \
          token_max_ttl=4h \
          secret_id_ttl=720h \
          secret_id_num_uses=0

        ROLE_ID=$$(vault read -field=role_id auth/approle/role/cashu-vault/role-id)
        SECRET_ID=$$(vault write -f -field=secret_id auth/approle/role/cashu-vault/secret-id)

        echo "VAULT_ROLE_ID=$$ROLE_ID"
        echo "VAULT_SECRET_ID=$$SECRET_ID"

        echo "$$ROLE_ID" > /vault/file/role-id
        echo "$$SECRET_ID" > /vault/file/secret-id

        echo "Vault initialized with $${VAULT_MOUNT} KV v2 engine and AppRole auth"
    volumes:
      - vault-data:/vault/file
    restart: "no"
    networks:
      - cashu
  cashu-vault-jpa:
    image: docker.398ja.xyz/cashu-vault-jpa:${CASHU_VAULT_VERSION:-latest}
    environment:
      DATASOURCE_URL: jdbc:postgresql://cashu-vault-db:5432/cashu_vault
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://cashu-vault-db:5432/cashu_vault
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CASHU_VAULT_PORT: ${CASHU_VAULT_PORT:-3333}
      SERVER_PORT: ${CASHU_VAULT_PORT:-3333}
      SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      # HashiCorp Vault configuration (uses AppRole credentials from vault-init)
      VAULT_BACKEND: HASHICORP
      VAULT_HASHI_URI: http://hashicorp-vault:8200
      VAULT_HASHI_AUTH_METHOD: ${VAULT_HASHI_AUTH_METHOD:-APPROLE}
      VAULT_HASHI_ROLE_ID: ${VAULT_HASHI_ROLE_ID}
      VAULT_HASHI_SECRET_ID: ${VAULT_HASHI_SECRET_ID}
      VAULT_HASHI_ENGINE_MOUNT: ${VAULT_HASHI_ENGINE_MOUNT:-cashu}
    depends_on:
      cashu-vault-db:
        condition: service_healthy
      hashicorp-vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    ports:
      - "${CASHU_VAULT_PORT:-3333}:${CASHU_VAULT_PORT:-3333}"
    volumes:
      - vault-logs:/app/logs
    restart: unless-stopped
    networks:
      - cashu
    healthcheck:
      test: [
        "CMD-SHELL",
        "URL=http://localhost:${CASHU_VAULT_PORT:-3333}/actuator/health/readiness; if command -v curl >/dev/null 2>&1; then curl -fsS \"$$URL\" >/dev/null; elif command -v wget >/dev/null 2>&1; then wget -qO- \"$$URL\" >/dev/null; else echo 'no http client for healthcheck' >&2; exit 1; fi"
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  phoenixd:
    image: acinq/phoenixd:latest
    ports:
      - "${PHOENIXD_PORT:-9740}:${PHOENIXD_PORT:-9740}"
    restart: unless-stopped
    networks:
      cashu:
        aliases:
          - phoenixd
    volumes:
      - phoenixd-data:/var/lib/phoenixd/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${PHOENIXD_PORT:-9740}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  payment-adapter-rest:
    image: docker.398ja.xyz/payment-adapter-rest:${PAYMENT_ADAPTER_VERSION:-latest}
    environment:
      PAYMENT_ADAPTER_PORT: ${PAYMENT_ADAPTER_PORT:-8080}
      GATEWAY_API_BASE_URL: ${GATEWAY_API_BASE_URL:-http://payment-adapter-rest}
      SERVER_ADDRESS: 0.0.0.0
      PAYMENT_ADAPTER_PROVIDER: ${PAYMENT_ADAPTER_PROVIDER:-mock}
      PHOENIXD_BASE_URL: http://${PHOENIXD_SERVICE:-phoenixd}:${PHOENIXD_PORT:-9740}
      PHOENIXD_API_KEY: ${PHOENIXD_API_KEY:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-adapter-db:5432/cashu_gateway
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: ${PAYMENT_ADAPTER_PORT:-8080}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      # Webhook configuration - send payment notifications to mint
      WEBHOOK_URL: http://cashu-mint-rest:${CASHU_MINT_PORT:-7777}/webhook/payment
      WEBHOOK_SECRET: ${MINT_WEBHOOK_SECRET}
      WEBHOOK_ENABLED: "true"
    depends_on:
      payment-adapter-db:
        condition: service_healthy
    ports:
      - "${PAYMENT_ADAPTER_PORT:-8080}:${PAYMENT_ADAPTER_PORT:-8080}"
    restart: unless-stopped
    networks:
      - cashu
    healthcheck:
      test: [
        "CMD-SHELL",
        "URL=http://localhost:${PAYMENT_ADAPTER_PORT:-8080}/actuator/health/readiness; if command -v curl >/dev/null 2>&1; then curl -fsS \"$$URL\" >/dev/null; elif command -v wget >/dev/null 2>&1; then wget -qO- \"$$URL\" >/dev/null; else echo 'no http client for healthcheck' >&2; exit 1; fi"
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  payment-adapter-webhook:
    image: docker.398ja.xyz/payment-adapter-webhook:${PAYMENT_ADAPTER_WEBHOOK_VERSION:-latest}
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: ${PAYMENT_ADAPTER_WEBHOOK_PORT:-9090}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "${PAYMENT_ADAPTER_WEBHOOK_PORT:-9090}:${PAYMENT_ADAPTER_WEBHOOK_PORT:-9090}"
    restart: unless-stopped
    networks:
      - cashu
    healthcheck:
      test: [
        "CMD-SHELL",
        "URL=http://localhost:${PAYMENT_ADAPTER_WEBHOOK_PORT:-9090}/actuator/health/readiness; if command -v curl >/dev/null 2>&1; then curl -fsS \"$$URL\" >/dev/null; elif command -v wget >/dev/null 2>&1; then wget -qO- \"$$URL\" >/dev/null; else echo 'no http client for healthcheck' >&2; exit 1; fi"
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  cashu-mint-rest:
    build:
      context: .
      dockerfile: cashu-mint-rest/Dockerfile
    image: docker.398ja.xyz/cashu-mint-rest:${CASHU_MINT_VERSION:-latest}
    ports:
      - "${CASHU_MINT_PORT:-7777}:${CASHU_MINT_PORT:-7777}"
    environment:
      SERVER_PORT: ${CASHU_MINT_PORT:-7777}
      SERVER_ADDRESS: 0.0.0.0
      CASHU_VAULT_BASE_URL: http://cashu-vault-jpa:${CASHU_VAULT_PORT:-3333}
      VAULT_BASE_URL: http://cashu-vault-jpa:${CASHU_VAULT_PORT:-3333}
      PAYMENT_ADAPTER_BASE_URL: http://payment-adapter-rest:${PAYMENT_ADAPTER_PORT:-8080}
      GATEWAY_API_BASE_URL: http://payment-adapter-rest:${PAYMENT_ADAPTER_PORT:-8080}
      # Issue #346 — actuator lives on its own port and is deliberately NOT published
      # in `ports:` above, so it is reachable on the internal compose network only.
      # Prometheus scrapes it from a sibling container.
      CASHU_MINT_MANAGEMENT_PORT: ${CASHU_MINT_MANAGEMENT_PORT:-9000}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      # Webhook configuration
      MINT_WEBHOOK_SECRET: ${MINT_WEBHOOK_SECRET}
      # Gateway client timeouts (optimized for virtual threads)
      GATEWAY_CLIENT_CONNECT_TIMEOUT: ${GATEWAY_CLIENT_CONNECT_TIMEOUT:-5s}
      GATEWAY_CLIENT_READ_TIMEOUT: ${GATEWAY_CLIENT_READ_TIMEOUT:-30s}
    depends_on:
      cashu-vault-jpa:
        condition: service_started
      payment-adapter-rest:
        condition: service_started
      payment-adapter-webhook:
        condition: service_started
    restart: unless-stopped
    networks:
      - cashu
    volumes:
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${CASHU_MINT_MANAGEMENT_PORT:-9000}/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  cashu-mint-admin-rest:
    image: docker.398ja.xyz/cashu-mint-admin-rest:${CASHU_MINT_ADMIN_VERSION:-latest}
    ports:
      - "${CASHU_MINT_ADMIN_PORT:-7778}:${CASHU_MINT_ADMIN_PORT:-7778}"
    environment:
      SERVER_PORT: ${CASHU_MINT_ADMIN_PORT:-7778}
      SERVER_ADDRESS: 0.0.0.0
      DATASOURCE_URL: jdbc:postgresql://admin-db:5432/cashu_admin
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: postgres
      DATASOURCE_DRIVER: org.postgresql.Driver
      ADMIN_API_TOKEN: ${CASHU_MINT_ADMIN_API_TOKEN:-local-dev-token}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
    depends_on:
      admin-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cashu
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${CASHU_MINT_ADMIN_PORT:-7778}/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
volumes:
  vault-db-data:
  gateway-db-data:
  admin-db-data:
  vault-logs:
  vault-data:
  phoenixd-data:
networks:
  cashu:
    name: cashu
