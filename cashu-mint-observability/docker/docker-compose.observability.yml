# Docker Compose configuration for Cashu Mint Observability Stack
#
# This stack provides:
# - Prometheus for metrics collection and storage
# - Alertmanager for alert routing and notification
# - Grafana for metrics visualization and dashboards
# - Loki for log aggregation
# - Promtail for log collection
# - Jaeger for distributed tracing
#
# Usage:
#   Start observability stack:
#     docker compose -f cashu-mint-observability/docker/docker-compose.observability.yml up -d
#
#   Stop observability stack:
#     docker compose -f cashu-mint-observability/docker/docker-compose.observability.yml down
#
# Access:
#   - Prometheus: http://localhost:9090
#   - Alertmanager: http://localhost:9093
#   - Grafana: http://localhost:3000 (admin/admin)
#   - Loki: http://localhost:3100
#   - Jaeger UI: http://localhost:16686
#
# The stack assumes cashu-mint-rest-dev is running on the 'cashu' network.
# Start the dev stack first with:
#   docker compose -f docker-compose.dev.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: cashu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # File service discovery targets. Mount an environment-specific
      # directory here (staging, prod) to point the same config at a
      # different mint without editing prometheus.yml.
      - ${CASHU_PROMETHEUS_TARGETS_DIR:-./prometheus/targets}:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - cashu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      alertmanager:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: cashu-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--cluster.advertise-address=0.0.0.0:9093'
    networks:
      - cashu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:10.2.0
    container_name: cashu-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/cashu-mint-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - cashu
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  loki:
    image: grafana/loki:2.9.2
    container_name: cashu-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - cashu
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  promtail:
    image: grafana/promtail:2.9.2
    container_name: cashu-promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - cashu
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: cashu-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - cashu
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:16686 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  prometheus-data:
    name: cashu-prometheus-data
  alertmanager-data:
    name: cashu-alertmanager-data
  grafana-data:
    name: cashu-grafana-data
  loki-data:
    name: cashu-loki-data

networks:
  cashu:
    external: true
