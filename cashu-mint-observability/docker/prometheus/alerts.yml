groups:
  - name: cashu-mint-alerts
    rules:
      # Service Health Alerts
      - alert: CashuMintDown
        expr: up{job="cashu-mint"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Cashu Mint is down"
          description: "Cashu Mint instance {{ $labels.instance }} has been down for more than 1 minute."
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#mint-down"

      - alert: CashuMintHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(cashu_mint_requests_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency detected"
          description: "95th percentile latency is {{ $value | printf \"%.2f\" }}s (threshold: 1s)"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#high-latency"

      - alert: CashuMintHighErrorRate
        expr: |
          sum(rate(cashu_mint_requests_total{status=~"5xx"}[5m]))
          / sum(rate(cashu_mint_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | printf \"%.2f\" }}% (threshold: 5%)"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#high-error-rate"

      # Business Alerts
      - alert: CashuMintHighLiability
        expr: cashu_mint_sats_outstanding > 10000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outstanding liability is high"
          description: "Outstanding sats: {{ $value | printf \"%.0f\" }} (threshold: 10M sats)"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#high-liability"

      - alert: CashuMintDoubleSpendAttempts
        expr: rate(cashu_mint_proofs_double_spend_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Double-spend attempts detected"
          description: "Double-spend rate: {{ $value | printf \"%.2f\" }}/s - possible attack in progress"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#double-spend"

      - alert: CashuMintQuoteBacklog
        expr: cashu_mint_quotes_active > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High number of active quotes"
          description: "Active quotes: {{ $value }} (threshold: 100) - possible payment processing issue"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#quote-backlog"

      # Task Performance Alerts
      - alert: CashuMintTaskFailureRate
        expr: |
          sum by (task_name) (rate(cashu_mint_task_failure_total[5m]))
          / (sum by (task_name) (rate(cashu_mint_task_success_total[5m]))
             + sum by (task_name) (rate(cashu_mint_task_failure_total[5m]))) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High task failure rate for {{ $labels.task_name }}"
          description: "Task {{ $labels.task_name }} failure rate is {{ $value | printf \"%.2f\" }}% (threshold: 10%)"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#task-failures"

      - alert: CashuMintSlowTasks
        expr: |
          histogram_quantile(0.95, sum by (task_name, le) (rate(cashu_mint_task_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow task execution: {{ $labels.task_name }}"
          description: "Task {{ $labels.task_name }} P95 latency is {{ $value | printf \"%.2f\" }}s (threshold: 500ms)"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#slow-tasks"

      # Gateway Health Alerts
      - alert: CashuMintGatewayUnhealthy
        expr: cashu_mint_gateway_health == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Lightning gateway is unhealthy"
          description: "Gateway has been unhealthy for more than 2 minutes - mint/melt operations will fail"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#gateway-unhealthy"

      - alert: CashuMintVaultUnhealthy
        expr: cashu_mint_vault_health == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Vault/database is unhealthy"
          description: "Vault has been unhealthy for more than 2 minutes - operations will fail"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#vault-unhealthy"

      # Voucher Alerts
      - alert: CashuMintVoucherRejectionRate
        expr: |
          sum(rate(cashu_mint_vouchers_rejected_total[5m]))
          / (sum(rate(cashu_mint_vouchers_redeemed_total[5m]))
             + sum(rate(cashu_mint_vouchers_rejected_total[5m]))) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High voucher rejection rate"
          description: "Voucher rejection rate is {{ $value | printf \"%.2f\" }}% (threshold: 10%)"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#voucher-rejections"

  - name: cashu-mint-slo-alerts
    rules:
      # SLO-based Alerts (Service Level Objectives)
      - alert: CashuMintAvailabilitySLOBreach
        expr: |
          (1 - (sum(rate(cashu_mint_requests_total{status=~"5xx"}[1h]))
                / sum(rate(cashu_mint_requests_total[1h])))) < 0.999
        for: 5m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Availability SLO breach (99.9%)"
          description: "Current availability: {{ $value | printf \"%.4f\" }}% - below 99.9% SLO"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#slo-breach"

      - alert: CashuMintLatencySLOBreach
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(cashu_mint_requests_duration_seconds_bucket[1h]))) > 2
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "Latency SLO breach (P99 < 2s)"
          description: "P99 latency: {{ $value | printf \"%.2f\" }}s - above 2s SLO threshold"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#slo-breach"

      # Error Budget Alerts
      - alert: CashuMintErrorBudgetBurning
        expr: |
          (sum(rate(cashu_mint_requests_total{status=~"5xx"}[1h]))
           / sum(rate(cashu_mint_requests_total[1h]))) > 0.001 * 10
        for: 15m
        labels:
          severity: warning
          slo: error_budget
        annotations:
          summary: "Error budget burning too fast"
          description: "Error rate is 10x the allowed rate - will exhaust monthly budget in {{ 30 / 10 }} days"
          runbook_url: "https://github.com/your-org/cashu-mint/wiki/runbooks#error-budget"

  - name: cashu-mint-capacity-alerts
    rules:
      # Capacity Planning Alerts
      - alert: CashuMintHighRequestRate
        expr: sum(rate(cashu_mint_requests_total[5m])) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High request rate"
          description: "Request rate: {{ $value | printf \"%.1f\" }} req/s - consider scaling"

      - alert: CashuMintProofIssuanceSpike
        expr: |
          sum(rate(cashu_mint_proofs_issued_total[5m]))
          > 2 * sum(rate(cashu_mint_proofs_issued_total[1h] offset 1h))
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Unusual proof issuance spike"
          description: "Proof issuance rate is 2x higher than previous hour - monitoring for anomalies"

  # ---------------------------------------------------------------
  # Spec 004 voucher data minimisation alerts (T606 / FR-015 / FR-016)
  # ---------------------------------------------------------------
  - name: cashu-mint-voucher-spec004
    rules:
      # FR-015 — orphan issuance is a token-integrity violation; page
      # immediately. The threshold gauge comes from a Grafana
      # PostgreSQL panel scraping voucher_quote; this alert mirrors
      # the same query via the Prometheus counter that increments on
      # each rejection.
      - alert: VoucherFundingRequiredSpike
        expr: rate(cashu_mint_voucher_funding_required_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          spec: '004'
          route: pagerduty
        annotations:
          summary: "Sustained voucher funding_required rejections"
          description: "rate={{ $value | printf \"%.2f\" }}/s for 5m — webhook bridge may be lagging or funding gate is misconfigured"
          runbook_url: "https://github.com/398ja/cashu-mint/blob/master/docs/runbooks/voucher-data-minimisation.md"

      # FR-014 — every IOU issuance fires the alert counter regardless
      # of policy. Increase > 0 in 15m means a new IOU was issued.
      - alert: VoucherIouIssued
        expr: increase(cashu_mint_voucher_iou_issued_total[15m]) > 0
        for: 1m
        labels:
          severity: warning
          spec: '004'
          route: slack-merchant-finance
        annotations:
          summary: "Voucher issued backed by merchant IOU"
          description: "An IOU-backed voucher was issued in the last 15 minutes. Operator review required."
          runbook_url: "https://github.com/398ja/cashu-mint/blob/master/docs/runbooks/voucher-data-minimisation.md"

      # FR-008 — sustained rate-limit breaches mean a buggy / abusive
      # client. Single 429 is fine; sustained 10/min is not.
      - alert: VoucherRateLimitBreachSustained
        expr: rate(cashu_mint_voucher_rate_limit_breach_total[5m]) > 10/60
        for: 5m
        labels:
          severity: warning
          spec: '004'
          route: slack-vouchers-ops
        annotations:
          summary: "Sustained voucher rate-limit breaches"
          description: "Principal {{ $labels.principal }} is breaching the rate limit at {{ $value | printf \"%.2f\" }}/s"

      # Backfill / readiness — if the actuator readiness probe stays
      # DOWN for an hour, something's wrong with the backfill job.
      - alert: VoucherBackfillStuck
        expr: probe_success{job="cashu-mint-readiness"} == 0
        for: 1h
        labels:
          severity: warning
          spec: '004'
          route: slack-vouchers-ops
        annotations:
          summary: "Voucher identity backfill stuck"
          description: "/actuator/health/readiness has been DOWN for 1h — backfill may have failed mid-batch"
          runbook_url: "https://github.com/398ja/cashu-mint/blob/master/specs/004-voucher-data-minimisation/quickstart.md#troubleshooting"

  # Spec 004 T605 / FR-017 — backward-compat aliases for the
  # deprecated plural metric names that pre-existed PR #321 (which
  # introduced singular cashu_mint_voucher_*). Recording rules CREATE
  # the alias time-series alongside the singular originals so existing
  # alerts / dashboards keep working while consumers migrate. REMOVE
  # this entire group after one release cycle (tracked by SC-010 lint).
  # PR #324 review fix: previously implemented as metric_relabel_configs
  # in prometheus.yml — which REWROTE singular → plural, silently
  # dropping the singular name and breaking the spec-004 dashboards.
  - name: cashu_mint_voucher_compat
    interval: 15s
    rules:
      - record: cashu_mint_vouchers_face_value_issued_total
        expr: cashu_mint_voucher_face_value_issued_total
      - record: cashu_mint_vouchers_face_value_redeemed_total
        expr: cashu_mint_voucher_face_value_redeemed_total
      - record: cashu_mint_vouchers_fees_collected_total
        expr: cashu_mint_voucher_fees_collected_total
      - record: cashu_mint_vouchers_issued_total
        expr: cashu_mint_voucher_issued_total
      - record: cashu_mint_vouchers_quotes_active
        expr: cashu_mint_voucher_quotes_active
      - record: cashu_mint_vouchers_redeemed_total
        expr: cashu_mint_voucher_redeemed_total
      - record: cashu_mint_vouchers_rejected_total
        expr: cashu_mint_voucher_rejected_total
