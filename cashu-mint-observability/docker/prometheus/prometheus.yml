# Prometheus configuration for Cashu Mint observability
# Scrapes metrics from the mint's actuator endpoint

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager)
  external_labels:
    monitor: 'cashu-mint'

# Rule files (for alerting rules)
rule_files:
  - "alerts.yml"

scrape_configs:
  # Cashu Mint metrics
  - job_name: 'cashu-mint'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['cashu-mint-rest-dev:7777']
        labels:
          env: 'development'
          service: 'cashu-mint'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'
    # Spec 004 T605 / FR-017 — backward-compat aliases for the
    # deprecated plural metric names are defined as RECORDING RULES
    # in alerts.yml (group: cashu_mint_voucher_compat). Recording
    # rules CREATE the alias time-series while the original
    # singular cashu_mint_voucher_* names continue to flow through
    # unchanged. The previous metric_relabel_configs approach
    # REWROTE singular → plural, which silently dropped the
    # singular name and broke the spec-004 dashboards. See
    # PR #324 review.

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
