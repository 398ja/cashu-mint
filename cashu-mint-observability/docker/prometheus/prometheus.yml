# Prometheus configuration for Cashu Mint observability
# Scrapes metrics from the mint's actuator endpoint

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager)
  external_labels:
    monitor: 'cashu-mint'

# Rule files (for alerting rules)
rule_files:
  - "alerts.yml"

scrape_configs:
  # Cashu Mint metrics.
  #
  # Targets come from file service discovery rather than a hardcoded
  # `static_configs` host. The dev container name (`cashu-mint-rest-dev`)
  # resolves on the dev stack and nowhere else, so a staging or production
  # Prometheus scraping this same config silently found no target — `up` was
  # absent rather than 0, so even the CashuMintDown alert stayed quiet while
  # every dashboard read "No data".
  #
  # Each environment supplies its own `targets/cashu-mint.yml`; the file is
  # re-read live, so a target change needs no Prometheus restart.
  - job_name: 'cashu-mint'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    file_sd_configs:
      # Issue #346 — actuator is on the management port, not the public API port.
      - files:
          - '/etc/prometheus/targets/cashu-mint*.yml'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
