# Prometheus configuration for Cashu Mint observability
# Scrapes metrics from the mint's actuator endpoint

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager)
  external_labels:
    monitor: 'cashu-mint'

# Rule files (for alerting rules)
rule_files:
  - "alerts.yml"

scrape_configs:
  # Cashu Mint metrics
  - job_name: 'cashu-mint'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['cashu-mint-rest-dev:7777']
        labels:
          env: 'development'
          service: 'cashu-mint'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'
    # Spec 004 T605 / FR-017 — backward-compat aliases for the
    # deprecated plural metric names that pre-existed PR #321 (which
    # introduced singular cashu_mint_voucher_*). Existing alerts /
    # dashboards keep working while consumers migrate. REMOVE after
    # one release cycle (tracked by SC-010 lint).
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'cashu_mint_voucher_(face_value_issued_total|face_value_redeemed_total|fees_collected_total|issued_total|quotes_active|redeemed_total|rejected_total)'
        target_label: __name__
        replacement: 'cashu_mint_vouchers_${1}'
        action: replace

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
