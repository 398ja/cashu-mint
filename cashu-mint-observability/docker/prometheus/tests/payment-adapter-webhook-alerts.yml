# promtool unit tests for the payment-adapter webhook alerts.
#
# Run with:
#   docker run --rm --entrypoint promtool \
#     -v "$PWD/cashu-mint-observability/docker/prometheus:/etc/prometheus:ro" \
#     prom/prometheus:v2.47.0 test rules /etc/prometheus/tests/payment-adapter-webhook-alerts.yml
#
# An alert nobody has ever seen fire is a hypothesis, not a safety net. These
# pin all three states that matter: it pages on a real loss, it stays quiet on a
# healthy adapter, and it notices when it has been silently disarmed by the
# adapter not being scraped at all.
rule_files:
  - /etc/prometheus/alerts.yml

evaluation_interval: 1m

tests:
  # An abandoned notification means the payment settled and the mint was never
  # told. It must page immediately, with no sustain period.
  - interval: 1m
    input_series:
      - series: 'payment_adapter_webhook_abandoned_total{service="payment-adapter"}'
        values: '0 0 1 1 1 1 1 1'
      - series: 'payment_adapter_webhook_delivered_total{service="payment-adapter"}'
        values: '5 5 5 5 5 5 5 5'
    alert_rule_test:
      - eval_time: 1m
        alertname: MintWebhookNotificationAbandoned
        exp_alerts: []
      - eval_time: 3m
        alertname: MintWebhookNotificationAbandoned
        exp_alerts:
          - exp_labels:
              severity: critical
              service: payment-adapter
              route: pagerduty
            exp_annotations:
              summary: "Payment notification abandoned — mint never told an invoice was paid"
              description: "1 payment notification(s) exhausted every retry to the mint webhook in the last 5m. The payment settled with the provider but the mint never issued, so value was taken and nothing handed back. Reconcile the affected quotes by hand; this never self-resolves."
              runbook_url: "https://github.com/398ja/cashu-mint/blob/master/docs/how-to/enable-observability.md"

  # A healthy adapter delivering notifications must stay silent on all three.
  - interval: 1m
    input_series:
      - series: 'payment_adapter_webhook_delivered_total{service="payment-adapter"}'
        values: '0+5x20'
      - series: 'payment_adapter_webhook_abandoned_total{service="payment-adapter"}'
        values: '0x20'
      - series: 'payment_adapter_webhook_retry_total{service="payment-adapter"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: MintWebhookNotificationAbandoned
        exp_alerts: []
      - eval_time: 20m
        alertname: MintWebhookRetriesElevated
        exp_alerts: []
      - eval_time: 20m
        alertname: PaymentAdapterMetricsAbsent
        exp_alerts: []

  # An adapter nobody scrapes looks exactly like a healthy one, so the absence
  # itself has to alert or the abandonment rule is silently disarmed.
  - interval: 1m
    input_series:
      - series: 'up{job="cashu-mint"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: PaymentAdapterMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              service: payment-adapter
              route: pagerduty
            exp_annotations:
              summary: "payment-adapter metrics are not being scraped"
              description: "payment_adapter_webhook_delivered_total is absent, so MintWebhookNotificationAbandoned cannot fire. Check that the adapter is a Prometheus target and that /actuator/prometheus is exposed on its management port."
              runbook_url: "https://github.com/398ja/cashu-mint/blob/master/docs/how-to/enable-observability.md"
