# Prometheus file service discovery — payment-adapter scrape targets.
#
# Default (dev stack) target. Override per environment exactly as for the
# mint; the job's file_sd glob picks up every `payment-adapter-*.yml` here.
#
# The port is the adapter's management port. It defaults to the API port
# (PAYMENT_ADAPTER_MANAGEMENT_PORT), so change this if you split them.

- targets:
    - 'payment-adapter-rest:8080'
  labels:
    env: 'development'
    service: 'payment-adapter'
