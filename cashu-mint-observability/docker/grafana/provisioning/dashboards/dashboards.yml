# Grafana dashboard provisioning
# Automatically loads dashboards from the specified folder

apiVersion: 1

providers:
  - name: 'Cashu Mint Dashboards'
    orgId: 1
    folder: 'Cashu Mint'
    folderUid: 'cashu-mint'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
