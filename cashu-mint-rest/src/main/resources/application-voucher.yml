# ===================================================================
# Cashu Mint Voucher Configuration
# ===================================================================
#
# This configuration enables gift card voucher functionality in the mint.
#
# IMPORTANT: This file should be activated by setting the Spring profile:
#   spring.profiles.active=voucher
#   OR
#   SPRING_PROFILES_ACTIVE=voucher (environment variable)
#
# ===================================================================

# Enable voucher functionality
voucher:
  enabled: true

  # Mint issuer configuration
  # SECURITY: These keys must be kept secure and never committed to version control
  mint:
    # Private key for signing vouchers: secp256k1, 64-character hex (32 bytes).
    # Generate with: openssl rand -hex 32
    # REQUIRED: Must be set via environment variable
    issuerPrivateKey: ${MINT_VOUCHER_ISSUER_PRIVKEY:}

    # Public key corresponding to the private key: BIP-340 x-only, 64-character hex.
    #
    # NOT the 33-byte compressed form and NOT its raw hex: derive it with a BIP-340
    # helper, not by prefixing 02/03. Voucher signatures are Schnorr over secp256k1,
    # the same scheme Nostr uses, so a key that works as a Nostr pubkey works here.
    #
    # This key is published and used by merchants to verify vouchers.
    # REQUIRED: Must be set via environment variable
    issuerPublicKey: ${MINT_VOUCHER_ISSUER_PUBKEY:}

  # Nostr relay configuration
  #
  # Every key below is honoured. Settings the voucher library never read (health checks,
  # backoff, batch size, auto-reconnect) are gone rather than left looking configurable (#407).
  nostr:
    # Nostr relay URLs for the voucher ledger (NIP-33) and backups (NIP-17), comma-separated.
    # Set MINT_VOUCHER_NOSTR_RELAYS to replace the whole list, e.g. to point a private or test
    # deployment at its own relay. It is a single scalar on purpose: a YAML list cannot be
    # replaced by an indexed environment variable, only added to.
    relays: ${MINT_VOUCHER_NOSTR_RELAYS:wss://relay.damus.io,wss://relay.cashu.xyz}

    # Relay connection timeout in milliseconds
    connectionTimeoutMs: ${MINT_VOUCHER_NOSTR_CONNECTION_TIMEOUT_MS:5000}

    # Timeout for publishing a ledger or backup event (voucher issuance), in milliseconds
    publishTimeoutMs: ${MINT_VOUCHER_NOSTR_PUBLISH_TIMEOUT_MS:5000}

    # Timeout for querying ledger or backup events (status checks), in milliseconds
    queryTimeoutMs: ${MINT_VOUCHER_NOSTR_QUERY_TIMEOUT_MS:10000}

    # Connection attempts per relay after the first, with a linearly growing pause
    maxRetries: 3

    # Refuse to start with fewer relays than minimumRelays
    requireMinimumRelays: true
    minimumRelays: 1

# ===================================================================
# Example Environment Variables (for Docker/Kubernetes deployments)
# ===================================================================
#
# MINT_VOUCHER_ISSUER_PRIVKEY=your-64-char-hex-private-key
# MINT_VOUCHER_ISSUER_PUBKEY=your-64-char-hex-public-key
# MINT_VOUCHER_NOSTR_RELAYS=wss://relay.example.org,wss://relay2.example.org
# SPRING_PROFILES_ACTIVE=voucher
#
# ===================================================================
# Example Docker Compose Configuration
# ===================================================================
#
# services:
#   cashu-mint:
#     image: cashu-mint-rest:latest
#     environment:
#       - SPRING_PROFILES_ACTIVE=voucher
#       - MINT_VOUCHER_ISSUER_PRIVKEY=${MINT_VOUCHER_ISSUER_PRIVKEY}
#       - MINT_VOUCHER_ISSUER_PUBKEY=${MINT_VOUCHER_ISSUER_PUBKEY}
#     ports:
#       - "7777:7777"
#
# ===================================================================
# Model B Vouchers
# ===================================================================
#
# This mint implements Model B vouchers:
# - Vouchers are issued by the mint but signed with separate issuer keys
# - Vouchers can ONLY be REDEEMED (for goods/services) at the issuing merchant
# - Vouchers CAN be swapped at the mint (essential for P2P transfers and double-spend prevention)
# - Model B enforcement (merchant-only redemption) happens at the APPLICATION layer, not here
#
# Why swaps must be allowed:
# - Double-spend prevention: Receivers must swap to get fresh proofs
# - P2P transfers: Alice sends to Carol, Carol swaps to prevent Alice double-spending
# - Splitting: Re-partitioning proofs for partial sends requires swap
#
# Model B vs Model A:
# - Model A: Anyone can redeem vouchers at the mint (convert to bitcoin)
# - Model B: Only the merchant can redeem vouchers (merchant validates at application layer)
# - Both models allow swaps at the mint protocol layer
#
# ===================================================================
