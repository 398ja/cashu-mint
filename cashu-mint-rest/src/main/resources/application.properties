spring.application.name=cashu-mint-rest
server.port=${SERVER_PORT:${CASHU_MINT_PORT:7777}}
server.address=${SERVER_ADDRESS:0.0.0.0}
# No application-local datasource is required; the service reads keysets from the vault DB via protocol services.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Source for the development mint keyset; PreloadMintLoadService reads this file.
# (PreloadMintLoadService is now removed; seeding is handled by SQL script)

# Actuator (health/info/prometheus exposure for ops)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Metric tags (common labels)
management.metrics.tags.application=cashu-mint
management.metrics.tags.env=${ENVIRONMENT:local}

# Observability configuration
cashu.observability.enabled=true
cashu.observability.tasks.enabled=true
cashu.observability.metrics.track-keysets=true

# Histogram buckets for latency (in seconds)
management.metrics.distribution.slo.cashu_mint_requests_duration_seconds=0.01,0.05,0.1,0.25,0.5,1.0,2.5,5.0,10.0
management.metrics.distribution.slo.cashu_mint_task_duration_seconds=0.001,0.005,0.01,0.025,0.05,0.1,0.25,0.5,1.0
management.metrics.distribution.slo.cashu_mint_proof_verification_duration_seconds=0.001,0.005,0.01,0.025,0.05,0.1
management.metrics.distribution.slo.cashu_mint_signature_generation_duration_seconds=0.001,0.005,0.01,0.025,0.05,0.1

# Enable percentiles for timers
management.metrics.distribution.percentiles-histogram.cashu_mint_requests_duration_seconds=true
management.metrics.distribution.percentiles-histogram.cashu_mint_task_duration_seconds=true
management.metrics.distribution.percentiles-histogram.cashu_mint_proof_verification_duration_seconds=true
management.metrics.distribution.percentiles-histogram.cashu_mint_signature_generation_duration_seconds=true

# Set minimum expected values to avoid 0.0 SLO issues
management.metrics.distribution.minimum-expected-value.cashu_mint_proof_verification_duration_seconds=0.001
management.metrics.distribution.minimum-expected-value.cashu_mint_signature_generation_duration_seconds=0.001
#debug=true

# Webhook configuration used by the Phoenixd gateway; can be overridden via env
webhook.wid=${WEBHOOK_WID:phoenixd}

# --- Logging ---
# Console logging with overridable levels
spring.output.ansi.enabled=ALWAYS
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.xyz.tcheeric.cashu=${LOG_LEVEL_CASHU:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
