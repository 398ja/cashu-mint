spring.application.name=cashu-mint-rest
server.port=${SERVER_PORT:${CASHU_MINT_PORT:7777}}
server.address=${SERVER_ADDRESS:0.0.0.0}
# No application-local datasource is required; the service reads keysets from the vault DB via protocol services.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Source for the development mint keyset; PreloadMintLoadService reads this file.
# (PreloadMintLoadService is now removed; seeding is handled by SQL script)

# Actuator (basic health/info exposure for ops)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
#debug=true

# Webhook configuration used by the Phoenixd gateway; can be overridden via env
webhook.wid=${WEBHOOK_WID:phoenixd}

# --- Logging ---
# Console logging with overridable levels
spring.output.ansi.enabled=ALWAYS
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.xyz.tcheeric.cashu=${LOG_LEVEL_CASHU:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
