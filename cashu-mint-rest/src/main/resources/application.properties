spring.application.name=cashu-mint-rest
server.port=${SERVER_PORT:${CASHU_MINT_PORT:7777}}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATASOURCE_URL:jdbc:postgresql://localhost:5432/cashu_mint}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATASOURCE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
# Provide a safe default dialect to avoid failures when JDBC metadata is unavailable at startup
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator (basic health/info exposure for ops)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
#debug=true

# Webhook configuration used by the Phoenixd gateway; can be overridden via env
webhook.wid=${WEBHOOK_WID:phoenixd}

# --- Logging ---
# Console logging with overridable levels
spring.output.ansi.enabled=ALWAYS
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.xyz.tcheeric.cashu=${LOG_LEVEL_CASHU:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n

