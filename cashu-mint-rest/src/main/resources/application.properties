spring.application.name=cashu-mint-rest
server.port=${SERVER_PORT:${CASHU_MINT_PORT:7777}}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Virtual Threads (Project Loom) - requires Java 21+
# Enable virtual threads for all request handling (Tomcat, async tasks)
# Toggle: SPRING_THREADS_VIRTUAL_ENABLED=true|false
# Production: Set to false until VT deployment is validated via staged rollout
# Rollback: Set env var to false and restart (no code deployment needed)
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:true}

# Tomcat connection limits for virtual threads
# CRITICAL: With VTs, max-connections is the primary concurrency limit, not threads.max
# Without limits, VTs can accept unlimited requests, exhausting heap or downstream services
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:2000}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT:20000}

# Platform thread pool (carrier threads) - reduced since VTs handle concurrency
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:50}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:10}

# Gateway client configuration for virtual thread optimization
# Uses JDK HttpClient with VT executor for efficient I/O handling
gateway.client.connect-timeout=${GATEWAY_CLIENT_CONNECT_TIMEOUT:5s}
gateway.client.read-timeout=${GATEWAY_CLIENT_READ_TIMEOUT:30s}

# No application-local datasource is required; the service reads keysets from the vault DB via protocol services.
# When the cashu-mint-jpa module is active (spec 001), MintJpaAutoConfiguration brings its own
# datasource gated by `cashu.mint.jpa.enabled=true`. Unit-test contexts leave it disabled.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Spec 001 persistence (mint_quote / issuance_record / webhook_event). Set to true in
# staging/prod to bind quote amounts and webhook deliveries to durable rows. Off by
# default so unit-test boots and dev profiles without Postgres still work.
cashu.mint.jpa.enabled=${CASHU_MINT_JPA_ENABLED:false}
cashu.mint.jpa.datasource.url=${MINT_DB_URL:}
cashu.mint.jpa.datasource.username=${MINT_DB_USER:}
cashu.mint.jpa.datasource.password=${MINT_DB_PASSWORD:}
cashu.mint.jpa.flyway.enabled=${MINT_FLYWAY_ENABLED:true}

# Source for the development mint keyset; PreloadMintLoadService reads this file.
# (PreloadMintLoadService is now removed; seeding is handled by SQL script)

# Actuator (health/info/prometheus exposure for ops)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.prometheus.metrics.export.enabled=true

# Metric tags (common labels)
management.metrics.tags.application=cashu-mint
management.metrics.tags.env=${ENVIRONMENT:local}

# Observability configuration
cashu.observability.enabled=true
cashu.observability.tasks.enabled=true
cashu.observability.metrics.track-keysets=true

# Histogram configuration removed - using code-level defaults to avoid PropertiesMeterFilter conflicts
# Timers still work, just without custom histogram bucketing
#debug=true

# Webhook configuration used by the Phoenixd gateway; can be overridden via env
webhook.wid=${WEBHOOK_WID:phoenixd}

# Spec 001 webhook integrity (US2). Shared secret is mandatory in non-local
# profiles (WebhookSecretStartupValidator); provider is the high half of the
# durable (provider, provider_event_id) idempotency key (FR-006).
# Resolution order: MINT_WEBHOOK_SECRET env var → legacy webhook.secret
# property (back-compat for deployments that still set WEBHOOK_SECRET).
cashu.mint.webhook.shared-secret=${MINT_WEBHOOK_SECRET:${webhook.secret:}}
cashu.mint.webhook.provider=${MINT_WEBHOOK_PROVIDER:${WEBHOOK_WID:phoenixd}}

# Spec 002 melt-saga driver (US2) — gated on cashu.mint.jpa.enabled=true.
# payment-timeout: max wait for LightningPaymentPort.pay before the outcome is
#                  treated as Unknown.
# reconcile-interval: cadence at which MeltSagaReconciler polls PAYMENT_UNKNOWN
#                     sagas via LightningPaymentPort.checkStatus and sweeps
#                     stale PROOFS_HELD sagas (research R5 / R9).
# payment-unknown-ttl: how long a saga may stay in PAYMENT_UNKNOWN before the
#                     reconciler fires an operator alert (still no auto-resolve).
# proofs-held-ttl:    PROOFS_HELD sagas older than this are moved to FAILED.
cashu.mint.melt.payment-timeout=${MINT_MELT_PAYMENT_TIMEOUT:PT30S}
cashu.mint.melt.reconcile-interval=${MINT_MELT_RECONCILE_INTERVAL:PT60S}
cashu.mint.melt.payment-unknown-ttl=${MINT_MELT_PAYMENT_UNKNOWN_TTL:PT1H}
cashu.mint.melt.proofs-held-ttl=${MINT_MELT_PROOFS_HELD_TTL:PT5M}

# Spec 002 T311 — admin endpoints (/admin/**) HTTP Basic auth credentials.
# Required for operator tooling. Production: set MINT_ADMIN_PASSWORD to a
# rotated value out of band. Leaving blank in non-local profiles locks the
# admin endpoints (the in-memory password becomes unmatchable).
cashu.mint.admin.username=${MINT_ADMIN_USERNAME:admin}
cashu.mint.admin.password=${MINT_ADMIN_PASSWORD:}

# Webhook HMAC secret for signature validation
# If empty, signature validation is disabled (development mode only)
# CRITICAL: In production, always set MINT_WEBHOOK_SECRET to secure webhook endpoint
webhook.secret=${MINT_WEBHOOK_SECRET:}

# --- Spec 004: Voucher Data Minimisation ---
# CRITICAL: identity-salt has no default. Generate via `openssl rand -hex 32`
# and store in a secret manager. Mint boot fails when unset or < 32 bytes.
# See specs/004-voucher-data-minimisation/quickstart.md § 1 for the runbook.
cashu.mint.voucher.identity-salt=${CASHU_MINT_VOUCHER_IDENTITY_SALT:}
# How long identity columns survive after a voucher quote reaches a terminal
# state (ISSUED / EXPIRED / FAILED). Default 90 days per Clarifications Q2.
cashu.mint.voucher.identity-retention=${CASHU_MINT_VOUCHER_IDENTITY_RETENTION:PT2160H}
# Rows per transaction in the boot-time identity backfill job. Default 1000.
cashu.mint.voucher.identity-backfill-batch-size=${CASHU_MINT_VOUCHER_IDENTITY_BACKFILL_BATCH_SIZE:1000}
# Spring cron expression for the daily retention purge job. Default 03:00 mint-local.
cashu.mint.voucher.identity-purge-cron=${CASHU_MINT_VOUCHER_IDENTITY_PURGE_CRON:0 0 3 * * *}

# --- NUT-17 WebSocket Configuration ---
# Enable WebSocket subscriptions for real-time state updates
cashu.websocket.enabled=${CASHU_WEBSOCKET_ENABLED:true}

# --- Logging ---
# Console logging with overridable levels
spring.output.ansi.enabled=ALWAYS
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.xyz.tcheeric.cashu=${LOG_LEVEL_CASHU:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
