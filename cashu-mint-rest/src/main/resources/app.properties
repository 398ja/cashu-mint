# Left side is the webhook ID (as configured in phoenixd), right side is the logical name.
# Gateway mappings (method and method+unit). Use DummyGateway (no webhooks required)
gateway.bolt11.sat=xyz.tcheeric.gateway.dummy.DummyGateway
gateway.bolt11=xyz.tcheeric.gateway.dummy.DummyGateway
