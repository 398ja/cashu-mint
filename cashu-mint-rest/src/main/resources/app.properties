# Application-level defaults for gateway configuration.
# This file is read by gateway implementations directly via the classpath
# and does not participate in Spring placeholder resolution.

# Webhook identifier mapping required by PhoenixdGateway.
# Left side is the webhook ID (as configured in phoenixd), right side is the logical name.
# Webhook base URL is required by PhoenixdGateway
webhook.base_url=http://cashu-gateway-webhook:9090

# Gateway mappings (method and method+unit) for BOLT11
gateway.bolt11.sat=xyz.tcheeric.gateway.phoenixd.PhoenixdGateway
gateway.bolt11=xyz.tcheeric.gateway.phoenixd.PhoenixdGateway
