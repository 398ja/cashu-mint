spring.application.name=cashu-mint-admin-rest
server.port=${SERVER_PORT:${CASHU_MINT_ADMIN_PORT:7778}}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Virtual threads
spring.threads.virtual.enabled=true
server.tomcat.threads.max=50

# Database (PostgreSQL by default, override via environment variables)
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:55435/cashu_admin}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.postgresql.Driver}

# Flyway migrations. The admin's own migrations deliberately live outside
# db/migration: NAP ships its migrations at that root, and Flyway scans a
# location recursively, so a shared root would make the two version series
# collide on V1 (issue #372).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-admin

# Actuator (basic health/info exposure for ops)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true

# Jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Console logging with overridable levels
spring.output.ansi.enabled=ALWAYS
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.xyz.tcheeric.cashu=${LOG_LEVEL_CASHU:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n

# Administrative API security
admin.security.api-token=${ADMIN_API_TOKEN:local-dev-token}

# NAP: Nostr authentication for Operators, alongside the token above (issue #372).
# Off by default -- turning it on requires a Super Administrator npub, and a
# deployment that has not chosen one should fail to start rather than run without.
nap.enabled=${NAP_ENABLED:false}
admin.security.super-admin-npub=${ADMIN_SUPER_ADMIN_NPUB:}
nap.external-base-url=${ADMIN_EXTERNAL_BASE_URL:http://localhost:7778}
# Session TTLs and the cookie name live in nap-defaults.properties.
nap.cookie.secure=${ADMIN_SESSION_COOKIE_SECURE:true}

# Outbox scheduler
admin.outbox.enabled=true
admin.outbox.poll.interval=5000
admin.outbox.batch.size=100
admin.outbox.failure.backoff=PT30S

# Vault provisioning
admin.vault.provision.max-retries=5
