# NAP settings this application decides, rather than the deployment (issue #372).
# Kept out of application.properties because a test's own application.properties
# shadows that file wholesale and would drop these; this one is never shadowed.
# It still ranks below application.properties, so a deployment overrides any line.

# 15 minutes idle, 12 hours absolute. Refresh tokens stay off: a longer-lived
# credential buys fewer signing prompts, and an admin console is not worth that trade.
nap.session-idle-ttl-seconds=900
nap.session-absolute-ttl-seconds=43200
nap.refresh-ttl-seconds=0
nap.cookie.name=cashu_admin_session
nap.cookie.http-only=true
nap.cookie.same-site=Lax
