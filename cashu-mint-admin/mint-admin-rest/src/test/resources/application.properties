# Test configuration — H2 in-memory database
spring.datasource.url=jdbc:h2:mem:cashu_admin_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security
admin.security.api-token=test-token

# Disable outbox scheduler in tests
admin.outbox.enabled=false
