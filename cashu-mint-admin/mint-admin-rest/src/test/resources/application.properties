# Test configuration — H2 in-memory database
spring.datasource.url=jdbc:h2:mem:cashu_admin_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-admin

# Disable outbox scheduler in tests
admin.outbox.enabled=false

# NAP: sessions are the only way into the admin API, so every context needs it on.
# The JDBC stores are PostgreSQL-only; NapSchemaSeparationIT covers them on Postgres.
nap.enabled=true
nap.jdbc-stores=false
admin.security.super-admin-npub=npub10xlxvlhemja6c4dqv22uapctqupfhlxm9h8z3k2e72q4k9hcz7vqpkge6d
