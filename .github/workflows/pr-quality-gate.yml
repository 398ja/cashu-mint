name: PR Quality Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - master
      - main
      - 'release/**'

jobs:
  pr-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR quality
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;
            const body = pr.body || '';
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const errors = [];
            const notices = [];

            const conventional = /^\w+(\(.+\))?: .+/;
            if (!conventional.test(title)) {
              errors.push('PR title must follow Conventional Commits, e.g. "feat(scope): message".');
            }

            for (const commit of commits) {
              const msg = commit.commit.message.split('\n')[0];
              if (!conventional.test(msg)) {
                errors.push(`Commit ${commit.sha.substring(0,7)} message not Conventional: "${msg}"`);
              }
            }

            if (body.trim().length === 0) {
              errors.push('PR description must not be empty.');
            }

            const breaking = commits.some(c => c.commit.message.includes('BREAKING CHANGE') || /!:/.test(c.commit.message));
            if (breaking && !/breaking change/i.test(body)) {
              notices.push('Breaking change detected but not acknowledged in description.');
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            } else {
              notices.forEach(n => core.warning(n));
              core.notice('PR quality gate checks passed.');
            }

