name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to verify and release, e.g. 0.36.2. Required on a manual run,
          because github.ref_name is the BRANCH here, not a tag, and verifying
          "master" against the registry would fail for the wrong reason.
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Reposilite (maven.398ja.xyz) is the Maven repository for this estate.
      # GitHub Packages is not used anywhere and must not be reintroduced: this
      # workflow previously declared github-vault-* server ids while the poms
      # deploy to Reposilite via <distributionManagement>, so the credentials
      # never matched the target. MVN_USER/MVN_PASSWORD already exist here.
      - name: Configure Maven settings for Reposilite
        run: |
          mkdir -p "${HOME}/.m2"
          cat <<'EOF' > "${HOME}/.m2/settings.xml"
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>reposilite-releases</id>
                <username>${env.MVN_USER}</username>
                <password>${env.MVN_PASSWORD}</password>
              </server>
              <server>
                <id>reposilite-snapshots</id>
                <username>${env.MVN_USER}</username>
                <password>${env.MVN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Fail loudly and immediately rather than 20 minutes later at the deploy,
      # which is the failure mode that made #409 hard to spot.
      - name: Verify publish credentials are present
        env:
          MVN_USER: ${{ secrets.MVN_USER }}
          MVN_PASSWORD: ${{ secrets.MVN_PASSWORD }}
        run: |
          if [ -z "${MVN_USER}" ] || [ -z "${MVN_PASSWORD}" ]; then
            echo "::error::MVN_USER/MVN_PASSWORD are not set; the deploy would publish nothing."
            exit 1
          fi

      # No -P release: that profile does not exist, so it silently did nothing.
      # No GPG: the key was never configured here, Reposilite does not require
      # signatures, and -Dgpg.skip=true matches how releases were done by hand.
      - name: Build and deploy to Reposilite
        env:
          MVN_USER: ${{ secrets.MVN_USER }}
          MVN_PASSWORD: ${{ secrets.MVN_PASSWORD }}
        run: ./mvnw -B clean deploy -Dgpg.skip=true

      # A green tag push must imply the artifacts actually shipped.
      # The checker walks the root pom's <modules>, so it needs no Maven plugin
      # and no log output. See the script for the three approaches this
      # replaced and why each failed against the real repository.
      - name: Verify the artifacts are resolvable
        env:
          # On a tag push this is v0.36.2 and the script strips the "v".
          # On a manual run github.ref_name is the branch, so the input wins.
          VERSION: ${{ inputs.version || github.ref_name }}
        run: python3 .github/scripts/verify-published.py

      # Only on a tag: action-gh-release needs one, and a manual run is for
      # re-verifying or re-publishing an existing version.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
