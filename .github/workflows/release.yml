name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Reposilite (maven.398ja.xyz) is the Maven repository for this estate.
      # GitHub Packages is not used anywhere and must not be reintroduced: this
      # workflow previously declared github-vault-* server ids while the poms
      # deploy to Reposilite via <distributionManagement>, so the credentials
      # never matched the target. MVN_USER/MVN_PASSWORD already exist here.
      - name: Configure Maven settings for Reposilite
        run: |
          mkdir -p "${HOME}/.m2"
          cat <<'EOF' > "${HOME}/.m2/settings.xml"
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>reposilite-releases</id>
                <username>${env.MVN_USER}</username>
                <password>${env.MVN_PASSWORD}</password>
              </server>
              <server>
                <id>reposilite-snapshots</id>
                <username>${env.MVN_USER}</username>
                <password>${env.MVN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Fail loudly and immediately rather than 20 minutes later at the deploy,
      # which is the failure mode that made #409 hard to spot.
      - name: Verify publish credentials are present
        env:
          MVN_USER: ${{ secrets.MVN_USER }}
          MVN_PASSWORD: ${{ secrets.MVN_PASSWORD }}
        run: |
          if [ -z "${MVN_USER}" ] || [ -z "${MVN_PASSWORD}" ]; then
            echo "::error::MVN_USER/MVN_PASSWORD are not set; the deploy would publish nothing."
            exit 1
          fi

      # No -P release: that profile does not exist, so it silently did nothing.
      # No GPG: the key was never configured here, Reposilite does not require
      # signatures, and -Dgpg.skip=true matches how releases were done by hand.
      - name: Build and deploy to Reposilite
        env:
          MVN_USER: ${{ secrets.MVN_USER }}
          MVN_PASSWORD: ${{ secrets.MVN_PASSWORD }}
        run: |
          set -o pipefail
          # NOT -ntp here: that flag suppresses the "Uploading to" lines the
          # verification step reads back. Confirmed by running both ways.
          ./mvnw -B clean deploy -Dgpg.skip=true | tee /tmp/deploy.log

      # A green tag push must imply the artifacts are actually resolvable.
      # #409 and 398ja/cashu-lib#258 were both "workflow passed, nothing shipped".
      #
      # The module list is read back from what the deploy step UPLOADED, not
      # re-derived from the reactor. That checks the action rather than the
      # intention, and needs no extra plugin: an earlier draft called
      # exec:exec, which is unpinned here and would have resolved whatever
      # version of exec-maven-plugin happened to be newest.
      - name: Verify the artifacts are resolvable
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -oE 'Uploading to reposilite-releases: \S+\.pom' /tmp/deploy.log \
            | awk '{print $NF}' | sort -u > /tmp/uploaded.txt
          if [ ! -s /tmp/uploaded.txt ]; then
            echo "::error::the deploy step uploaded no .pom files; refusing to report success"
            exit 1
          fi
          echo "deploy uploaded $(wc -l < /tmp/uploaded.txt) pom(s)"
          fail=0
          while read -r url; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = "200" ]; then
              echo "ok    ${url##*/}"
            else
              echo "::error::${url##*/} not resolvable (HTTP ${code}) ${url}"
              fail=1
            fi
          done < /tmp/uploaded.txt
          # The tag must also match what was published, or a mistagged release
          # would verify happily against the previous version's artifacts.
          if ! grep -q "/${VERSION}/" /tmp/uploaded.txt; then
            echo "::error::no artifact was uploaded under version ${VERSION} (tag ${GITHUB_REF_NAME})"
            fail=1
          fi
          exit $fail

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
