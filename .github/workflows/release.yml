name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # The poms deploy to Reposilite (see <distributionManagement>), so the
      # server ids here must match those, not the GitHub Packages ids this
      # workflow used to declare. MVN_USER/MVN_PASSWORD already exist as
      # repository secrets.
      - name: Configure Maven settings for Reposilite
        run: |
          mkdir -p "${HOME}/.m2"
          cat <<'EOF' > "${HOME}/.m2/settings.xml"
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>reposilite-releases</id>
                <username>${env.MVN_USER}</username>
                <password>${env.MVN_PASSWORD}</password>
              </server>
              <server>
                <id>reposilite-snapshots</id>
                <username>${env.MVN_USER}</username>
                <password>${env.MVN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Fail loudly and immediately rather than 20 minutes later at the deploy,
      # which is the failure mode that made #409 hard to spot.
      - name: Verify publish credentials are present
        env:
          MVN_USER: ${{ secrets.MVN_USER }}
          MVN_PASSWORD: ${{ secrets.MVN_PASSWORD }}
        run: |
          if [ -z "${MVN_USER}" ] || [ -z "${MVN_PASSWORD}" ]; then
            echo "::error::MVN_USER/MVN_PASSWORD are not set; the deploy would publish nothing."
            exit 1
          fi

      # No -P release: that profile does not exist, so it silently did nothing.
      # No GPG: the key was never configured here, Reposilite does not require
      # signatures, and -Dgpg.skip=true matches how releases were done by hand.
      - name: Build and deploy to Reposilite
        env:
          MVN_USER: ${{ secrets.MVN_USER }}
          MVN_PASSWORD: ${{ secrets.MVN_PASSWORD }}
        run: ./mvnw -B -ntp clean deploy -DskipTests -Dgpg.skip=true

      # A green tag push must imply the artifacts are actually resolvable.
      # #409 and 398ja/cashu-lib#258 were both "workflow passed, nothing shipped".
      # A green tag push must imply the artifacts are actually resolvable.
      # #409 and 398ja/cashu-lib#258 were both "workflow passed, nothing shipped".
      # The module list comes from the reactor itself, so it cannot drift from
      # what was built, and it covers the nested cashu-mint-admin/* modules that
      # the hand-rolled 0.34.2 deploy silently missed.
      - name: Verify the artifacts are resolvable
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://maven.398ja.xyz/releases/xyz/tcheeric"
          ./mvnw -B -ntp -q exec:exec \
            -Dexec.executable=echo \
            -Dexec.args='REACTOR ${project.artifactId}' \
            -DskipTests 2>/dev/null | grep '^REACTOR ' | awk '{print $2}' | sort -u > /tmp/modules.txt
          if [ ! -s /tmp/modules.txt ]; then
            echo "::error::could not enumerate reactor modules; refusing to report success"
            exit 1
          fi
          fail=0
          while read -r aid; do
            url="${BASE}/${aid}/${VERSION}/${aid}-${VERSION}.pom"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = "200" ]; then
              echo "ok    ${aid} ${VERSION}"
            else
              echo "::error::${aid} ${VERSION} not published (HTTP ${code}) ${url}"
              fail=1
            fi
          done < /tmp/modules.txt
          exit $fail

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
