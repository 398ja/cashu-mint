name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      # `clean` is deliberate: without it, stale classes left in target/ can
      # satisfy references that no longer exist in the source tree, so an
      # incremental build passes while a fresh checkout would not (issue #399).
      - name: Build with Maven
        run: ./mvnw -q -B clean verify
      - name: Run tests with VT pinning detection
        run: |
          ./mvnw -q test -pl cashu-mint-protocol \
            -Djdk.tracePinnedThreads=short \
            -DargLine="-Djdk.tracePinnedThreads=short" \
            2>&1 | tee pinning-detection.log
          # Check for pinning events in test output
          if grep -q "VirtualThread.*pinned\|Pinned.*virtual" pinning-detection.log; then
            echo "::warning::Virtual thread pinning detected in tests"
            grep -A5 "pinned\|Pinned" pinning-detection.log || true
          fi
      - name: Upload pinning detection log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinning-detection-log
          path: pinning-detection.log
          if-no-files-found: ignore
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          if-no-files-found: ignore
      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec
          path: '**/target/jacoco.exec'
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/target/surefire-reports/*.xml'

  # AppSec review finding M-4 (issue #427). Integration tests only run under
  # -Pintegration-tests, and no workflow passed it, so `mvn verify` -- what CI runs and what
  # CONTRIBUTING asks of contributors -- reported success without executing a single integration
  # test. A skipped suite is indistinguishable from a passing one in every report anyone reads.
  # The unrun set included ActuatorManagementPortIT, the test that keeps /actuator/prometheus
  # (issuance rates, outstanding liability) off the public API port.
  #
  # Scoped to cashu-mint-protocol deliberately. Its 379 tests are hermetic and pass. The
  # cashu-mint-rest-it module needs Docker and live sibling services: on a clean checkout it
  # fails 47/37 of 169 with "Unexpected end of file from server" regardless of the change under
  # review, so gating merges on it would produce a check that cannot go green -- the mirror of
  # the check that cannot go red which this job exists to fix. Bringing that module into the
  # gate needs its container fixtures sorted out first; tracked in #427.
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install dependencies
        run: ./mvnw -q -B -Pintegration-tests -pl cashu-mint-protocol -am -DskipTests install
      - name: Run integration tests
        run: ./mvnw -B -Pintegration-tests -pl cashu-mint-protocol test

      # Proof that the profile actually selected integration tests. Without this, a change to
      # the profile or the surefire includes could silently stop selecting them and this job
      # would stay green -- which is exactly the failure mode #427 describes.
      - name: Assert integration tests actually ran
        if: always()
        run: |
          report_dir=cashu-mint-protocol/target/surefire-reports
          test -d "$report_dir" || { echo "::error::No surefire reports produced"; exit 1; }
          it_reports=$(ls "$report_dir" | grep -cE 'IntegrationTest\.txt$' || true)
          echo "Integration test classes that ran: $it_reports"
          if [ "$it_reports" -lt 2 ]; then
            echo "::error::Only $it_reports integration test classes ran."
            echo "::error::The -Pintegration-tests profile is not selecting them (issue #427)."
            exit 1
          fi

      # Issue #461 / #463 — the rest-it module, brought under the gate as a ratchet.
      #
      # The comment above explains why it was excluded: on a clean checkout it failed
      # 47 of 169 regardless of the change under review, so gating on green would have
      # produced a check that cannot pass — the mirror of the check that cannot fail.
      # That reasoning was right, and it is now out of date. The causes were found:
      # a signature-validator stub that stopped matching the interface it stood in for,
      # a @Profile("!test") that does not exclude "websocket-test", and assertions on
      # error names against bodies that carry numeric wire codes. The module now runs
      # 197 tests with 8 failures and 1 error, all pre-existing and individually tracked.
      #
      # A budget rather than a green gate, because the remaining 9 are genuine bugs
      # (FeeBearingSwapIT returning a melt-saga error from a swap, most of all) and
      # blocking every merge on them would get this job deleted. The budget only moves
      # down: fixing one and not lowering the number is how a ratchet silently becomes
      # a rubber stamp.
      #
      # The assertion that the suite RAN is the load-bearing half. 197 executing with
      # 8 failures is a worse-looking and far more useful signal than 0 executing with
      # none, which is what this repo reported for months.
      - name: Run rest-it integration tests
        if: always()
        run: ./mvnw -B -Pintegration-tests -pl cashu-mint-rest-it -am -DskipTests install
             && ./mvnw -B -Pintegration-tests -pl cashu-mint-rest-it verify || true

      - name: Assert rest-it ran, and that failures are within budget
        if: always()
        run: |
          report_dir=cashu-mint-rest-it/target/surefire-reports
          test -d "$report_dir" || { echo "::error::rest-it produced no reports at all"; exit 1; }

          # Default to 0 when the reports are empty or malformed. Without this
          # the arithmetic yields an empty string, `[ "" -lt 150 ]` prints
          # "integer expression expected" and returns 0, and the guard passes
          # for a build that produced no tests at all — the exact failure this
          # job exists to catch, reintroduced inside the check itself.
          ran=$(grep -h '^Tests run' "$report_dir"/*.txt 2>/dev/null \
                | sed 's/Tests run: \([0-9]*\).*/\1/' | paste -sd+ | bc)
          bad=$(grep -h '^Tests run' "$report_dir"/*.txt 2>/dev/null \
                | sed 's/.*Failures: \([0-9]*\), Errors: \([0-9]*\).*/\1+\2/' | paste -sd+ | bc)
          ran=${ran:-0}
          bad=${bad:-0}
          echo "rest-it: $ran tests ran, $bad failing"

          # A suite that does not run is the failure this job exists to catch.
          if [ "$ran" -lt 150 ]; then
            echo "::error::Only $ran rest-it tests ran; expected ~197."
            echo "::error::The suite is not being selected — see #463."
            exit 1
          fi

          # Ratchet. Lower this number when you fix one; never raise it.
          budget=2
          if [ "$bad" -gt "$budget" ]; then
            echo "::error::rest-it has $bad failing tests, budget is $budget."
            echo "::error::A new failure was introduced, or a fixed one regressed (#463)."
            exit 1
          fi
          if [ "$bad" -lt "$budget" ]; then
            echo "::notice::rest-it is down to $bad failing (budget $budget)."
            echo "::notice::Lower the budget in ci.yml to lock the improvement in."
          fi

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: cashu-mint-protocol/target/surefire-reports
          if-no-files-found: ignore
